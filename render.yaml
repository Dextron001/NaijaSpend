services:
  - type: web
    name: naijaspend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: data
      mountPath: /app/server/data
      sizeGB: 1
    autoDeploy: true
    plan: free
